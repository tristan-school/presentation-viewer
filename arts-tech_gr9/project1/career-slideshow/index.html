<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Slideshow Viewer</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- PDF.js Library from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <!-- Slide Display Viewport -->
  <main class="viewer-container">
    <div id="slide-stage" class="slide-stage">
      <canvas id="pdf-canvas"></canvas>
      <div id="loading-msg" class="status-msg">Loading presentation...</div>
    </div>
  </main>

  <!-- Sticky Footer Control Bar -->
  <footer class="footer-bar">
    <div class="controls">
      <button id="prev-btn" class="nav-btn" disabled>&larr; Previous</button>
      <span class="slide-counter">
        Slide <span id="current-slide">0</span> of <span id="total-slides">0</span>
      </span>
      <button id="next-btn" class="nav-btn" disabled>Next &rarr;</button>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
