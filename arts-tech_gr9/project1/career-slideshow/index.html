<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PowerPoint Viewer</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- JSZip dependency to unpack the PPTX file -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

  <!-- Full-bleed Slide Display Container -->
  <main class="viewer-container">
    <div id="slide-stage" class="slide-stage">
      <div class="status-msg">Loading presentation...</div>
    </div>
  </main>

  <!-- Sticky Footer Controls -->
  <footer class="footer-bar">
    <div class="controls">
      <button id="prev-btn" class="nav-btn" disabled>&larr; Previous</button>
      <span class="slide-counter">
        Slide <span id="current-slide">0</span> of <span id="total-slides">0</span>
      </span>
      <button id="next-btn" class="nav-btn" disabled>Next &rarr;</button>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
